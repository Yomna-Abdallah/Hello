<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>div</title>

    .card {

      margin: 50px auto;
      padding: 20px;
      background-color: #f9f9f9;

      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      font-family: Arial, sans-serif;
      text-align: center;

    .card h2 {
